<!DOCTYPE html>
<html>
<head>
<style>
body { font-family: Arial; padding:20px; }
button { margin:5px; }
</style>
</head>
<body>

<h2>Quiz</h2>

<p>1. 2 + 2 = ?</p>
<input type="radio" name="q1" value="3">3
<input type="radio" name="q1" value="4">4

<p>2. Capital of India?</p>
<input type="radio" name="q2" value="Delhi">Delhi
<input type="radio" name="q2" value="Mumbai">Mumbai

<br><br>
<button onclick="submitQuiz()">Submit</button>

<h3 id="score"></h3>

<script>
function submitQuiz(){
  let score = 0;

  if(document.querySelector('input[name="q1"]:checked')?.value == "4") score++;
  if(document.querySelector('input[name="q2"]:checked')?.value == "Delhi") score++;

  document.getElementById("score").innerText = "Score: " + score;
}
</script>

</body>
</html>
