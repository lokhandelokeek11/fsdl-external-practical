<!DOCTYPE html>
<html>
<head>
<style>
body { font-family: Arial; padding: 20px; }
h3 { background: #333; color: white; padding: 10px; cursor: pointer; }
p { border: 1px solid #333; padding: 10px; display: none; }
</style>
</head>
<body>

<h2>FAQ</h2>

<h3 onclick="toggle(this)">What is HTML?</h3>
<p>HTML is a markup language</p>

<h3 onclick="toggle(this)">What is CSS?</h3>
<p>CSS is used for styling</p>

<script>
function toggle(el){
  let p = el.nextElementSibling;
  p.style.display = p.style.display==="block" ? "none" : "block";
}
</script>

</body>
</html>
