<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Glossary</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: aliceblue;
            padding: 20px;
        }
        input {
            padding: 20px;
            width: 200px;
            margin-bottom: 20px;
        }
        table {
            width: 60%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        th{
            background-color: lightgray;
        }
    </style>
</head>
<body>
    <h2>Digital Glossary</h2>

    <input type = "text" id="search" placeholder="Search tag...." onkeyup="filtertable()">

    <table id = "table">
        <tr>
            <th>Tag</th><th>Description</th>
        </tr>
        <tr>
            <td>&lt;b&gt;</td><td>Bold</td>
        </tr>
        <tr>
            <td>&lt;i&gt;</td><td>Italics</td>
        </tr>
        <tr>
            <td>&lt;u&gt;</td><td>Underline</td>
        </tr>
    </table>
    <script>
        function filterTable(){
            let val = document.getElementById("search").value.toLowerCase();
            let rows = document.querySelectorAll("#table tr");

            rows.forEach((r,i)=>{
                if(i==0) return;
                r.style.display = r.innerText.toLowerCase().includes(val) ? "" : "none";
            });}
        
    </script>
</body>
</html>
