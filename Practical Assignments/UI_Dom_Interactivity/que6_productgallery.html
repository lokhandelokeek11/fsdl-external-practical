<!DOCTYPE html>
<html>
<head>
<style>
body { font-family: Arial; padding: 20px; }
.card { border: 1px solid #333; padding: 10px; width: 150px; margin: 10px; display: inline-block; text-align: center; }
button { padding: 5px; background: green; color: white; border: none; }
</style>
</head>
<body>

<h2>Products</h2>
<div id="products"></div>

<script>
let data = [
  {name:"Shirt", price:500},
  {name:"Shoes", price:1000}
];

let div = document.getElementById("products");

function buy(){
  alert("Purchased!");
}

data.forEach(p=>{
  div.innerHTML += `
    <div class="card">
      <h3>${p.name}</h3>
      <p>₹${p.price}</p>
      <button onclick="buy()">Buy</button>
    </div>`;
});

</script>

</body>
</html>
