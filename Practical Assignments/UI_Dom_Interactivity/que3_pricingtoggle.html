<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        button{ 
            padding: 20px;
            font-size: medium;
            color: aqua;
            background: black;
        }
    </style>
</head>
<body>
    <h2>Pricing Plan</h2>

    <button onclick="toggle()">Switch Plan</button>
    <h2 id = "price"> Rupees 100 / month</h2>

    <script>
        let yearly = false;
        function toggle(){
            yearly = !yearly;
            document.getElementById("price").innerText = yearly ? "Rupees 1000 / year" : "Rupees 100 / month";
        }
    </script>
</body>
</html>
