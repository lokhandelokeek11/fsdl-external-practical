<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Bar</title>
    <style>
        body{
            font-family:Arial, sans-serif;
            padding: 50px;
        }
        .skillbar{
            position: relative;
            background: #ddd;
            width: 300px;
            height: 200px;
            border-radius: 20px;
        }
        .fill{
            background: green;
            colour: white;
            padding: 8px;
            border-radius: 5px;
            position: absolute;
        }
    </style>
</head>
<body>
    <h2>Skills</h2>
    <div>
        <div class="skillbar">
            <div class="fill" style="width: 80%; height: 20px; top: 30px; left: 10px;">HTML</div>
            <div class="fill" style="width: 70%; height: 20px; top: 70px; left: 10px;">CSS</div>
            <div class="fill" style="width: 60%; height: 20px; top: 110px; left: 10px;">JavaScript</div>
            <div class="fill" style="width: 50%; height: 20px; top: 150px; left: 10px;">Python</div>
        </div>
    </div>
</body>
</html>
